<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>Manager</title>
  <defs>
    <clipPath id="mgr-window">
      <rect x="72" y="112" width="368" height="288" rx="44" />
    </clipPath>
  </defs>

  <!-- app tile -->
  <rect width="512" height="512" rx="112" fill="#15161B" />

  <!-- window body with sidebar, clipped to the rounded frame -->
  <g clip-path="url(#mgr-window)">
    <rect x="72" y="112" width="368" height="288" fill="#1B1D24" />
    <rect x="72" y="112" width="118" height="288" fill="#2EE6A6" fill-opacity="0.15" />
  </g>
  <rect x="72" y="112" width="368" height="288" rx="44" stroke="#2EE6A6" stroke-width="11" />

  <!-- sidebar items: first is the active one -->
  <rect x="102" y="162" width="58" height="16" rx="8" fill="#2EE6A6" />
  <rect x="102" y="204" width="44" height="16" rx="8" fill="#2EE6A6" fill-opacity="0.45" />
  <rect x="102" y="246" width="50" height="16" rx="8" fill="#2EE6A6" fill-opacity="0.45" />
  <rect x="102" y="288" width="38" height="16" rx="8" fill="#2EE6A6" fill-opacity="0.45" />

  <!-- terminal: prompt chevron, command line, output line -->
  <path d="M232 224l30 30-30 30" stroke="#2EE6A6" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" />
  <rect x="286" y="243" width="104" height="22" rx="11" fill="#2EE6A6" />
  <rect x="232" y="300" width="140" height="18" rx="9" fill="#2EE6A6" fill-opacity="0.35" />
</svg>
