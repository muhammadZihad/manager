<svg width="1100" height="620" viewBox="0 0 1100 620" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>Manager interface layout: project sidebar and terminal pane</title>
  <desc>An illustration of the Manager window — a sidebar listing projects grouped into Commands, Agents and Terminals, next to the active terminal session.</desc>
  <defs>
    <clipPath id="ui-frame">
      <rect x="20" y="20" width="1060" height="580" rx="14" />
    </clipPath>
    <style>
      .ui-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif; }
      .ui-mono { font-family: 'JetBrains Mono', Menlo, Consolas, monospace; }
    </style>
  </defs>

  <g clip-path="url(#ui-frame)">
    <rect x="20" y="20" width="1060" height="580" fill="#15161B" />

    <!-- ============ SIDEBAR ============ -->
    <rect x="20" y="20" width="290" height="580" fill="#1B1D24" />
    <line x1="310" y1="20" x2="310" y2="600" stroke="#2A2D37" stroke-width="1.5" />

    <!-- search field -->
    <rect x="42" y="44" width="246" height="34" rx="8" fill="#1C1E26" stroke="#2A2D37" stroke-width="1.5" />
    <circle cx="60" cy="61" r="5" stroke="#6B6F7A" stroke-width="1.8" fill="none" />
    <line x1="64" y1="65" x2="68" y2="69" stroke="#6B6F7A" stroke-width="1.8" stroke-linecap="round" />
    <text x="78" y="66" class="ui-sans" font-size="12.5" fill="#6B6F7A">Search projects &amp; items</text>

    <!-- project row: active -->
    <rect x="34" y="94" width="262" height="34" rx="8" fill="#2EE6A6" fill-opacity="0.12" />
    <path d="M48 106l6 6 6-6" stroke="#9A9EA8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <text x="70" y="116" class="ui-sans" font-size="13.5" font-weight="600" fill="#E6E7EB">acme-storefront</text>
    <rect x="212" y="102" width="26" height="18" rx="9" fill="#2EE6A6" />
    <text x="225" y="115" class="ui-sans" font-size="11" font-weight="700" fill="#0B0C0F" text-anchor="middle">3</text>
    <circle cx="256" cy="111" r="9" fill="#21232B" />
    <path d="M252.5 107.5h7M252.5 111h7M252.5 114.5h7" stroke="#9A9EA8" stroke-width="1.4" stroke-linecap="round" />
    <circle cx="280" cy="111" r="10" fill="#2EE6A6" fill-opacity="0.16" />
    <path d="M277 106.5l7 4.5-7 4.5z" fill="#2EE6A6" />

    <!-- group: Commands -->
    <path d="M62 146l5 5 5-5" stroke="#9A9EA8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <rect x="80" y="142" width="11" height="11" rx="2.5" stroke="#9A9EA8" stroke-width="1.5" fill="none" />
    <text x="99" y="152" class="ui-sans" font-size="12" fill="#9A9EA8">Commands</text>
    <text x="286" y="152" class="ui-sans" font-size="11" fill="#6B6F7A" text-anchor="end">2</text>

    <!-- item: dev server (active tab + running) -->
    <rect x="72" y="164" width="224" height="26" rx="6" fill="#2EE6A6" fill-opacity="0.12" />
    <rect x="72" y="164" width="2.5" height="26" fill="#2EE6A6" />
    <circle cx="92" cy="177" r="4" fill="#2EE6A6" />
    <circle cx="92" cy="177" r="7.5" fill="#2EE6A6" fill-opacity="0.22" />
    <text x="106" y="181" class="ui-sans" font-size="12.5" font-weight="500" fill="#E6E7EB">dev server</text>

    <!-- item: build watch -->
    <circle cx="92" cy="209" r="4" fill="#2EE6A6" />
    <text x="106" y="213" class="ui-sans" font-size="12.5" fill="#9A9EA8">build watch</text>

    <!-- group: Agents -->
    <path d="M62 242l5 5 5-5" stroke="#9A9EA8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <rect x="80" y="238" width="11" height="11" rx="3" stroke="#9A9EA8" stroke-width="1.5" fill="none" />
    <text x="99" y="248" class="ui-sans" font-size="12" fill="#9A9EA8">Agents</text>
    <text x="286" y="248" class="ui-sans" font-size="11" fill="#6B6F7A" text-anchor="end">1</text>

    <circle cx="92" cy="273" r="4" fill="#2EE6A6" />
    <text x="106" y="277" class="ui-sans" font-size="12.5" fill="#9A9EA8">claude</text>

    <!-- group: Terminals -->
    <path d="M62 306l5 5 5-5" stroke="#9A9EA8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <rect x="80" y="302" width="11" height="11" rx="2.5" stroke="#9A9EA8" stroke-width="1.5" fill="none" />
    <text x="99" y="312" class="ui-sans" font-size="12" fill="#9A9EA8">Terminals</text>
    <text x="286" y="312" class="ui-sans" font-size="11" fill="#6B6F7A" text-anchor="end">1</text>

    <circle cx="92" cy="337" r="4" fill="#6B6F7A" />
    <text x="106" y="341" class="ui-sans" font-size="12.5" fill="#9A9EA8">zsh</text>

    <!-- second project (collapsed) -->
    <path d="M48 380l6 6 6-6" stroke="#6B6F7A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none" transform="rotate(-90 54 383)" />
    <text x="70" y="388" class="ui-sans" font-size="13.5" font-weight="500" fill="#9A9EA8">internal-api</text>

    <!-- new project button -->
    <rect x="34" y="416" width="262" height="34" rx="8" stroke="#383C48" stroke-width="1.5" stroke-dasharray="5 4" fill="none" />
    <text x="165" y="438" class="ui-sans" font-size="12.5" fill="#9A9EA8" text-anchor="middle">+ New Project</text>

    <!-- app settings footer -->
    <line x1="20" y1="556" x2="310" y2="556" stroke="#2A2D37" stroke-width="1.5" />
    <circle cx="48" cy="578" r="7.5" stroke="#6B6F7A" stroke-width="1.6" fill="none" />
    <text x="66" y="583" class="ui-sans" font-size="12.5" fill="#9A9EA8">App Settings</text>

    <!-- ============ TERMINAL PANE ============ -->
    <rect x="310" y="20" width="770" height="580" fill="#181A20" />

    <g class="ui-mono" font-size="13">
      <text x="344" y="70" fill="#2EE6A6">➜</text>
      <text x="368" y="70" fill="#E4E6EB">npm run dev</text>

      <text x="344" y="102" fill="#6B6F7A">&gt; acme-storefront@1.4.0 dev</text>
      <text x="344" y="124" fill="#6B6F7A">&gt; vite</text>

      <text x="344" y="166" fill="#9A9EA8">  VITE v7.3.6  ready in 142 ms</text>

      <text x="344" y="206" fill="#2EE6A6">  ➜  Local:</text>
      <text x="452" y="206" fill="#E4E6EB">http://localhost:5173/</text>
      <text x="344" y="228" fill="#2EE6A6">  ➜  Network:</text>
      <text x="452" y="228" fill="#6B6F7A">use --host to expose</text>

      <text x="344" y="270" fill="#6B6F7A">02:41:18 [vite] hmr update /src/routes/cart.tsx</text>
      <text x="344" y="292" fill="#6B6F7A">02:41:26 [vite] hmr update /src/lib/pricing.ts</text>

      <text x="344" y="334" fill="#E6B02E">  ⚠  2 packages need attention</text>

      <text x="344" y="376" fill="#2EE6A6">➜</text>
      <rect x="368" y="365" width="8" height="16" fill="#2EE6A6" />
    </g>
  </g>

  <rect x="20" y="20" width="1060" height="580" rx="14" stroke="#2A2D37" stroke-width="2" fill="none" />
</svg>
