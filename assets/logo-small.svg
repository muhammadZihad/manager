<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>Manager</title>
  <!--
    Simplified variant of assets/logo.svg for small renders (tray icon, favicon,
    16-32px). Same composition, but fewer sidebar items and heavier strokes so
    the shapes survive when they're only a few pixels tall.
  -->
  <defs>
    <clipPath id="mgr-window-sm">
      <rect x="64" y="120" width="384" height="272" rx="48" />
    </clipPath>
  </defs>

  <rect width="512" height="512" rx="112" fill="#15161B" />

  <g clip-path="url(#mgr-window-sm)">
    <rect x="64" y="120" width="384" height="272" fill="#1B1D24" />
    <rect x="64" y="120" width="132" height="272" fill="#2EE6A6" fill-opacity="0.22" />
  </g>
  <rect x="64" y="120" width="384" height="272" rx="48" stroke="#2EE6A6" stroke-width="16" />

  <!-- two chunky sidebar items -->
  <rect x="98" y="188" width="64" height="26" rx="13" fill="#2EE6A6" />
  <rect x="98" y="244" width="48" height="26" rx="13" fill="#2EE6A6" fill-opacity="0.5" />

  <!-- oversized prompt -->
  <path d="M248 214l38 38-38 38" stroke="#2EE6A6" stroke-width="30" stroke-linecap="round" stroke-linejoin="round" />
  <rect x="316" y="236" width="86" height="30" rx="15" fill="#2EE6A6" />
</svg>
